# GEM-ENI reverse proxy — puts the app on port 80 so the URL carries no port.
#
# Everything goes to the web container; Next.js forwards /api/v1 to the API
# itself (same-origin rewrite), so this file needs a single upstream.

upstream gemeni_web {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Attachments are capped at 20 MB by the API; leave room for multipart
    # overhead. nginx's 1 MB default would reject uploads with a bare 413.
    client_max_body_size 25m;

    # Don't advertise the version on error pages.
    server_tokens off;

    access_log /var/log/nginx/gemeni.access.log;
    error_log  /var/log/nginx/gemeni.error.log warn;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    location / {
        proxy_pass http://gemeni_web;
        proxy_http_version 1.1;

        # Host + forwarded headers: the API's CSRF guard matches the request
        # origin against X-Forwarded-Host/Proto, so these must be accurate.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Keepalive to the upstream requires clearing the hop-by-hop header.
        proxy_set_header Connection "";

        # Streamed responses (attachment and export downloads, generated PDFs)
        # should reach the browser as they are produced, not after buffering.
        proxy_buffering off;

        # Report queries over a large ledger can be slow; well above the
        # default 60s, still bounded.
        proxy_connect_timeout 15s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
    }
}
