# GEM-ENI — full on-premise stack (Postgres, Redis, MinIO, API, worker, web).
#
#   cp .env.prod.example .env.prod      # then edit the passwords + WEB_ORIGIN
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only the web container publishes a host port; everything else talks over the
# private compose network. See docs/deploy-on-premise.md for the full runbook.

name: gemeni

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gemerp}
      POSTGRES_USER: ${POSTGRES_USER:-gemerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Uncomment ONLY if you need psql/pgAdmin from the server itself.
    # Binding to 127.0.0.1 keeps it off the LAN.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gemerp} -d ${POSTGRES_DB:-gemerp}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: queued jobs survive a restart. requirepass: no anonymous access.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required — set it in .env.prod}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required — set it in .env.prod}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required — set it in .env.prod}
    volumes:
      - minio_data:/data
    # Admin console — reachable at http://<server-ip>:9001. Comment out to close it.
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: creates the attachments bucket, then exits. Idempotent.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set gemeni http://minio:9000 "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}" &&
        mc mb --ignore-existing gemeni/${S3_BUCKET:-gemerp-attachments} &&
        echo "MinIO bucket '${S3_BUCKET:-gemerp-attachments}' is ready"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-gemerp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gemerp}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Browser-facing origin(s), comma-separated. The FIRST one is embedded in
      # generated QR scan URLs, so it must be what users actually type.
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required — set it in .env.prod}
      # true ONLY when users reach the app over HTTPS. Over plain http:// a
      # secure cookie is silently dropped and nobody can log in.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      S3_ENABLED: ${S3_ENABLED:-true}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-gemerp-attachments}
      S3_FORCE_PATH_STYLE: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # The image entrypoint runs `prisma migrate deploy` before booting, so every
    # `up -d --build` applies pending migrations automatically.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-gemerp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gemerp}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENABLED: ${S3_ENABLED:-true}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-gemerp-attachments}
      S3_FORCE_PATH_STYLE: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Internal DNS name of the api service — stable across deployments.
        API_PROXY_TARGET: http://api:3001
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production

volumes:
  postgres_data:
  redis_data:
  minio_data:
